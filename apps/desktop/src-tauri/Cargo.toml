[package]
name = "tapd-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TAPD enhanced desktop client"

[lib]
name = "tapd_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
portable-pty = "0.9"
reqwest = "0.13"
base64 = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
semver = "1"
sha2 = "0.10"
toml_edit = "0.22"
tapd-core = { path = "../../../crates/tapd-core" }
tauri-plugin-dialog = "2"

# The capsule needs AppKit itself: it must never become the key window, and its
# hover has to be tracked natively (see `island_window/macos.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSView",
  "NSTrackingArea",
  "NSEvent",
] }
objc2-foundation = { version = "0.3", features = ["NSObject", "NSGeometry"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
