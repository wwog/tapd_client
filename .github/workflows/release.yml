name: Release

# Pushes to the `release` branch produce an arm64 (Apple Silicon) dmg as a
# workflow artifact. Pushing a `v*` tag additionally publishes a GitHub
# Release with the Tauri updater artifacts (`*.app.tar.gz` + `.sig`) and
# `latest.json`, which the client polls hourly after launch.
# `release` only receives merges from `main` — develop there, not here.
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$UPDATER_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require updater key for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "::error::Tauri 更新签名密钥缺失：请在仓库 Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY（以及可选密码 TAURI_SIGNING_PRIVATE_KEY_PASSWORD）。"
            exit 1
          fi

      - name: Configure code signing (optional)
        # Requires APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and
        # APPLE_SIGNING_IDENTITY repository secrets. Skipped when absent,
        # producing an unsigned build.
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID_SECRET" ]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
          fi

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build companion SPA
        # Embedded by rust-embed into the app bundle; `dist-companion/` must
        # exist before cargo compiles, and release builds embed it (no runtime
        # fallback to disk).
        run: pnpm build:companion

      - name: Test Rust workspace
        run: pnpm test:rust

      - name: Build arm64 MCP sidecar
        run: bash scripts/build-sidecar.sh aarch64-apple-darwin

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 tauri.conf.json 版本 $VERSION 不一致；请先运行 scripts/release.sh。"
            exit 1
          fi

      - name: Build arm64 app and dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target aarch64-apple-darwin --bundles app,dmg)
          # Updater artifacts are only needed for a published release; branch
          # builds stay unsigned and usable as plain dmg artifacts.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm -C apps/desktop tauri build "${ARGS[@]}"

      - name: Collect artifacts
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          OUT=dist-release
          mkdir -p "$OUT"
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "$OUT"/
          cp -R "target/aarch64-apple-darwin/release/bundle/macos/TAPD Client.app" "$OUT"/

          # Rename the updater bundle so the release URL has no spaces.
          APP_TGZ=$(find target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          if [[ -n "$APP_TGZ" ]]; then
            ASSET="TAPD.Client_${VERSION}_aarch64.app.tar.gz"
            cp "$APP_TGZ" "$OUT/$ASSET"
            cp "$APP_TGZ.sig" "$OUT/$ASSET.sig"
            echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NOTES="docs/releases/${GITHUB_REF_NAME}.md"
            node scripts/make-latest-json.mjs \
              --version "$VERSION" \
              --tag "$GITHUB_REF_NAME" \
              --asset "$ASSET" \
              --signature "$OUT/$ASSET.sig" \
              --notes "$NOTES" \
              --out "$OUT/latest.json"
          fi

          # `./*` would include the `.app` bundle directory and make shasum fail.
          (cd "$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | xargs -0 shasum -a 256 > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          find "$OUT" -maxdepth 1 -print

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" release-notes.md
          else
            echo "TAPD Client ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapd-client-${{ steps.meta.outputs.version }}-arm64-${{ github.run_number }}
          path: dist-release
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist-release/*.dmg
            dist-release/*.app.tar.gz
            dist-release/*.app.tar.gz.sig
            dist-release/latest.json
            dist-release/SHA256SUMS.txt
