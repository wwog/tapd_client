name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck

      # `cargo check/test` compiles two JS-generated inputs: the MCP sidecar
      # (tauri's build script validates `externalBin`) and the companion SPA
      # (`RustEmbed` fails to compile without `dist-companion/`). The root
      # check/test scripts build both first, so no separate step is needed.
      - name: Check Rust workspace
        run: pnpm check:rust

      - name: Test Rust workspace
        run: pnpm test:rust
